name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync version with latest git tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ $LATEST_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION=${LATEST_TAG:1}
            npm pkg set version="$VERSION"
          fi

      - name: Release (git tag + GitHub release)
        run: npx release-it@latest --ci --no-npm.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance
